<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Betting Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* VOICE everyday-work: companion to the Picks League site, same structure, its own identity
   IDEA a field under the lights: turf-green ground, chalk-white lines, lime and gold markings
   PICTURE game cards on the board; inside a game, the final-margin curve
   COLOUR night turf #0b1a14, cards #11241c, chalk #eef5ef, lime #b6f05a lead, gold #f2c94c support, coral for losses
   TYPE Oswald (condensed, uppercase) for titles, tabs and figures; Source Sans 3 for text
   LAYOUT same as the league site: centered 900px column, slider tabs, 2-col cards that stay 2-col on phones */
:root{color-scheme:dark;--bg:#0b1a14;--card:#11241c;--card2:#163026;--line:#25473a;--line2:#1b3a2f;--ink:#eef5ef;--sub:#c6d6cc;--mute:#8fa89a;--dim:#6b8577;--blue:#b6f05a;--green:#6fe3a0;--red:#ff7b6b;--gold:#f2c94c;--purple:#8fd3ff;--home:#b6f05a;--away:#f2c94c;--lime:#b6f05a}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
body{font-family:'Source Sans 3',Arial,sans-serif;font-size:15px;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.header{text-align:center;padding:32px 24px 16px}
.header h1{font-family:Oswald,sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink)}
.header h1 b{color:var(--lime);font-weight:700}
.header h1::after{content:'';display:block;width:64px;height:3px;margin:10px auto 0;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px)}
.header .sub{font-size:12px;color:var(--mute);margin-top:6px;font-weight:600}
.tab-bar{display:flex;padding:0 16px;max-width:900px;margin:0 auto 14px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none;position:relative}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:none;padding:12px 16px;font-family:Oswald,sans-serif;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);background:none;border:none;cursor:pointer;white-space:nowrap;min-height:44px}
.tab-btn:hover,.tab-btn.active{color:var(--ink)}
.tab-slider{position:absolute;bottom:-1px;height:3px;background:var(--lime);border-radius:2px;transition:left .3s ease,width .3s ease}
.panel{max-width:900px;margin:0 auto;padding:0 24px 40px}
.anim{animation:fade .25s cubic-bezier(.4,0,.2,1)}
@keyframes fade{from{transform:translate3d(24px,0,0);opacity:.3}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}.tab-slider{transition:none}}
.wk-strip{display:flex;gap:6px;padding:4px 2px 8px;overflow-x:auto;scrollbar-width:thin;scroll-snap-type:x proximity;justify-content:safe center}
.wk{flex:none;scroll-snap-align:center;padding:5px 0;min-width:64px;border-radius:6px;background:var(--lime);color:#0b1a14;font-family:Oswald,sans-serif;font-size:16px;font-weight:700;text-align:center;border:0}
.wk span{display:block;font-size:10px;font-weight:600}
.wk.off{background:var(--card);color:var(--mute);border:1px solid var(--line2);font-size:13px}
.wk.today:not(.off){box-shadow:0 0 0 2px var(--ink) inset}
.wk .tdy{font-size:9px;letter-spacing:.6px}
.wk.off:hover{color:var(--ink);border-color:var(--line)}
.wk-seg{text-align:center;font-size:11px;color:var(--mute);font-weight:600;padding:2px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ribbon{grid-column:1/-1;padding:10px 4px 6px;font-size:13px;font-weight:800;color:var(--mute);border-bottom:1px solid var(--line2);text-transform:uppercase;letter-spacing:1px}
.game{display:block;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 14px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.game:hover{border-color:var(--lime);background:var(--card2)}
.game:focus-visible,.tab-btn:focus-visible,.seg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.g-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:8px;gap:8px}
.g-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.g-team{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;font-size:17px;font-weight:600;letter-spacing:.3px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge{--s:34px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:28% 28% 46% 46%;background:linear-gradient(160deg,var(--bc) 0%,var(--bc) 55%,color-mix(in srgb,var(--bc) 70%,#000) 100%);box-shadow:inset 0 0 0 2px var(--bn),0 2px 6px rgba(0,0,0,.35);color:#fff;font-family:Oswald,sans-serif;font-weight:700;font-size:calc(var(--s)*.34);letter-spacing:.3px;text-shadow:0 1px 1px rgba(0,0,0,.4);line-height:1}
.badge.lg{--s:72px;margin:0 auto 8px}
.badge{position:relative;overflow:hidden}
.badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.badge.lg-on{background:none;box-shadow:none;color:transparent;text-shadow:none;border-radius:0;overflow:visible}
.badge.lg-on img{inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.badge.lg-on img.loc{filter:drop-shadow(0 0 1px rgba(255,255,255,.35)) drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.badge.lg-on img{opacity:1}
.g-lg{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--lime);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.g-nm{display:flex;flex-direction:column;line-height:1.15}
.g-nm small{font-family:'Source Sans 3',sans-serif;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:0}
.g-ln{font-family:Oswald,sans-serif;font-size:14px;color:var(--sub);font-weight:500}
.g-rec{font-size:11px;color:var(--dim);font-weight:500}
.g-pct{font-family:Oswald,sans-serif;font-size:19px;font-weight:600;color:var(--mute)}
.g-pct.fav{color:var(--ink)}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);font-size:11px;font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:800;white-space:nowrap}
.p-Bet{background:var(--lime);color:#0b1a14}
.p-Lean{background:rgba(242,201,76,.14);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(242,201,76,.4)}
.p-Pass{background:var(--card2);color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.card h2{padding:11px 16px;font-family:Oswald,sans-serif;font-size:15px;font-weight:500;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--lime)}
.card .body{padding:14px 16px}
.hdr1{background:linear-gradient(135deg,#163a2d,#1d4a39)}
.hdr2{background:linear-gradient(135deg,#1f3a2a,#2b5039)}
.hdr3{background:linear-gradient(135deg,#3a3418,#4d4520)}
.hdr4{background:linear-gradient(135deg,#14262d,#1b3440)}
.hdr5{background:linear-gradient(135deg,#1d4a2a,#276038)}
.hdr6{background:linear-gradient(135deg,#18363a,#1f4a4e)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;font-family:Oswald,sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:600;text-align:center;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap}
td{padding:10px 12px;font-size:13px;text-align:center;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
th:first-child,td.nm{text-align:left}
td.nm{font-weight:600}
td small{display:block;color:var(--dim);font-size:11px;font-weight:500}
.w{color:var(--green);font-weight:700}.l{color:var(--red);font-weight:700}.t{color:var(--gold);font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.back:hover{color:var(--ink)}
.final{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--sub);font-weight:600}
.final b{font-weight:800}
.logged{font-size:13px;color:var(--sub);line-height:1.7}
.logged b{color:var(--ink)}
.mh{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px 16px 16px;margin-bottom:10px}
.mh-time{text-align:center;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:10px}
.mh-teams{display:flex;align-items:center;justify-content:center}
.mh-team{flex:1;text-align:center}
.mh-ab{font-family:Oswald,sans-serif;font-size:30px;text-transform:uppercase;font-weight:700;letter-spacing:1px}
.mh-nm{font-size:13px;font-weight:700;color:var(--ink)}
.mh-rec{font-size:11px;color:var(--dim);font-weight:500;margin-top:2px}
.mh-wp{font-family:Oswald,sans-serif;font-size:28px;font-weight:600;margin-top:6px}
.mh-at{font-size:12px;color:var(--dim);font-weight:700;padding:0 12px}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:12px;background:var(--line2)}
.bar i{display:block;height:100%}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-top:3px solid var(--lime)}
.qc.c2{border-top-color:var(--green)}.qc.c3{border-top-color:var(--gold)}.qc.c4{border-top-color:var(--purple)}
.lb{font-family:Oswald,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);font-weight:500}
.qn{font-family:Oswald,sans-serif;font-size:21px;font-weight:600;letter-spacing:.3px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:12px;color:var(--mute);margin-top:2px}
.segs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin:6px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.seg{padding:8px 2px;border-bottom:2px solid transparent;color:var(--mute);font-family:Oswald,sans-serif;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;min-height:36px;display:flex;align-items:center}
.seg:hover{color:var(--ink)}
.seg.active{color:var(--ink);border-bottom-color:var(--lime)}
.fig{position:relative;height:280px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--card);stroke-width:4px;font:13px 'Source Sans 3',sans-serif;fill:var(--sub)}
.leg{display:grid;gap:6px;margin-top:10px;font-size:12px;color:var(--sub)}
.leg div{display:flex;justify-content:space-between;gap:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.leg b{font-weight:800;color:var(--ink)}
.read p{font-size:13px;line-height:1.7;color:var(--sub);margin-bottom:10px}
.read b{color:var(--ink)}
.read .best{padding:10px 12px;background:rgba(182,240,90,.07);border:1px solid rgba(182,240,90,.2);border-left:3px solid var(--lime);border-radius:8px;color:var(--ink);font-weight:700}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--lime)}
.lns{display:grid;gap:2px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ln:last-child{border-bottom:0}
.ln-l{font-size:14px;font-weight:700}.ln-l small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px}
.ln-c{display:flex;align-items:center;gap:6px;flex:none}
.ln-c input{width:4.2em;height:40px;border:1px solid var(--line);border-radius:10px;text-align:center;font:600 18px Oswald,sans-serif;background:var(--bg);color:var(--ink)}
.ln-c input:focus{outline:2px solid var(--lime);outline-offset:1px}
.sg{width:40px;height:40px;border-radius:10px;border:0;background:rgba(111,227,160,.16);color:var(--green);font:700 22px Oswald,sans-serif;cursor:pointer}
.sg.neg{background:rgba(255,123,107,.16);color:var(--red)}
.nd{width:36px;height:40px;border-radius:10px;border:0;background:var(--card2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
@media(max-width:640px){.nd{width:32px}.ln-c{gap:4px}.ln-c input{width:3.6em}}
.nd:hover,.sg:hover{filter:brightness(1.2)}
.spread-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.step button{width:40px;height:40px;border:0;background:var(--card2);color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.step button:hover{background:var(--line)}
.step input{width:4.6em;height:40px;border:0;text-align:center;font:600 17px Oswald,sans-serif;background:transparent;color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{appearance:none}
.slip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left:3px solid var(--c)}
.bet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bet .nm2{font-family:Oswald,sans-serif;font-size:17px;font-weight:600;letter-spacing:.3px}
.bet .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;text-align:center}
.stats div{background:var(--card2);border-radius:6px;padding:6px 2px}
.stats span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);font-weight:600}
.stats b{font-family:Oswald,sans-serif;font-size:17px;font-weight:600}
.meter{position:relative;height:6px;background:var(--line2);border-radius:999px;margin-top:10px}
.meter::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px solid var(--dim)}
.meter i{position:absolute;top:0;bottom:0;border-radius:999px}
.note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.reset{font-size:12px;font-weight:700;padding:8px 14px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer}
.reset:hover{border-color:var(--lime)}
.drv{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 3.6em;gap:6px 10px;align-items:center;font-size:12px;color:var(--sub)}
.drv .grp{grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--blue);margin-top:10px}
.drv .grp:first-child{margin-top:0}
.dbar{position:relative;height:14px}
.dbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--dim)}
.dbar i{position:absolute;top:2px;height:10px;border-radius:2px}
.drv .v{text-align:right;font-weight:800;color:var(--ink);white-space:nowrap}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.pr:last-child{border-bottom:0}
.pr b{display:block;font-size:13px}
.pr small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.tg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.tg button{min-width:52px;min-height:32px;border:0;border-radius:6px;background:transparent;color:var(--mute);font-size:12px;font-weight:800;cursor:pointer}
.tg button.on.y{background:var(--lime);color:#0b1a14}
.tg button.on.n{background:rgba(255,123,107,.18);color:var(--red)}
.rk{display:inline-block;min-width:26px;padding:1px 5px;border-radius:4px;font-weight:800}
.rk.g1{color:var(--green);background:rgba(111,227,160,.1)}
.rk.g3{color:var(--red);background:rgba(255,123,107,.1)}
.why p{font-size:13px;line-height:1.75;color:var(--sub);padding:10px 16px;border-top:1px solid var(--line2)}
.why p:first-of-type{border-top:0}
.why b{color:var(--ink)}
.src{font-size:11px;color:var(--dim);padding:10px 16px;border-top:1px solid var(--line2);background:rgba(255,255,255,.02)}
.src a{color:var(--lime)}
.best-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line2)}
.best-row:first-child{border-top:0}
.best-row .r{font-family:Oswald,sans-serif;font-size:24px;font-weight:600;color:var(--lime);white-space:nowrap}
.best-row .r.lean{color:var(--gold)}
.how p{font-size:12.5px;color:var(--sub);margin:0 0 4px;line-height:1.6}
.how .t2{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:4px}
.how .sec{padding:10px 16px;border-top:1px solid var(--line2)}
.empty{padding:28px;text-align:center;color:var(--dim);font-size:13px}
.status{text-align:center;padding:30px 24px 20px;font-size:10px;color:var(--line)}

/* ---- flow pass: softer surfaces, fewer hard boxes */
body{background:radial-gradient(1200px 500px at 50% -120px,#163a2b 0%,transparent 70%),var(--bg)}
.card{border:0;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);margin-bottom:14px}
.card h2,.card h2[class]{background:none;border-bottom:0;padding:16px 18px 4px;font-size:13px;letter-spacing:1.4px;color:var(--mute)}
.card h2::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin:0 8px 2px 0;vertical-align:middle}
.card .body{padding:10px 18px 16px}
th{background:transparent;border-bottom:1px solid var(--line2)}
td{border-bottom-color:rgba(255,255,255,.04)}
.mh{border:0;border-radius:20px;background:radial-gradient(circle at 15% 0,color-mix(in srgb,var(--away) 16%,transparent),transparent 55%),radial-gradient(circle at 85% 0,color-mix(in srgb,var(--home) 16%,transparent),transparent 55%),var(--card);padding:18px 18px 20px}
.qg{gap:12px}
.qc{border:0;border-radius:14px;padding:14px 16px;background:var(--card)}
.qc .lb::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin:0 7px 1px 0;vertical-align:middle}
.qc.c2 .lb::before{background:var(--green)}.qc.c3 .lb::before{background:var(--gold)}.qc.c4 .lb::before{background:var(--purple)}
.bet{border:0;border-radius:14px;border-left:3px solid var(--c)}
.segs{border-bottom:0}
.final{border:0;border-radius:14px}
.tab-bar{border-bottom-color:rgba(255,255,255,.06)}
/* ---- date ribbon (text tabs with underline) */
.dtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.07);margin:0 -24px 6px;padding:0 24px;scroll-behavior:smooth}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex:none;position:relative;padding:12px 14px 14px;font-size:16px;font-weight:600;color:var(--mute);white-space:nowrap}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--ink);font-weight:800}
.dtab.on::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--lime)}
/* ---- day sections + game cards */
.day h3{font-size:19px;font-weight:800;margin:22px 2px 10px;letter-spacing:.1px}
.day h3 small{font-size:12px;font-weight:600;color:var(--dim);margin-left:8px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

<body>
<div class="header"><h1>EV Betting <b>Model</b></h1><div class="sub" id="subTitle">Loading…</div></div>
<div class="tab-bar" id="tabBar">
  <a class="tab-btn" href="#board" data-tab="board">Home</a>
  <a class="tab-btn" href="#best" data-tab="best">Best Bets</a>
  <a class="tab-btn" href="#record" data-tab="record">Track Record</a>
  <div class="tab-slider" id="tabSlider"></div>
</div>
<div class="panel" id="app"><div class="empty">Loading the model…</div></div>
<div class="status" id="status"></div>
<script>
{

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATS=[['RushYPG','Rushing yards/game'],['RushYPC','Yards per rush'],['PassYPG','Passing yards/game'],['PassYPA','Yards per pass attempt'],['RZTD','Red zone TD %'],['PPG','Points/game']];
const TABS=[['pick','The pick'],['lines','Lines & bets'],['drivers','Drivers'],['matchup','Matchup'],['context','Context'],['writeup','Write-up']];
const COL={season:2,home:3,away:4,l3:5};
let LD=[],GAMES=[],META={},SET={},ST={},LOG=[],RES=[],CW=null,SELWK=null,SELDAY=null;
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))};
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const be=o=>o<0?-o/(100-o):100/(o+100);
const sgn=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const odds=o=>o>0?'+'+Math.round(o):'−'+Math.abs(Math.round(o));
const pct=(x,d=1)=>(x*100).toFixed(d)+'%';
const fair=p=>p>=.5?-100*p/(1-p):100*(1-p)/p;
const fairOdds=fair;
const profit=o=>o>0?o:10000/-o;
const wxSev=wx=>!wx||wx.roof==='Dome'?0:Math.min(1.5,Math.max(0,((wx.windMph||0)-10)/15)+(wx.precip==='Rain'?.3:wx.precip==='Snow'?.5:0)+(wx.tempF!=null&&wx.tempF<25?.2:0));
const wxText=wx=>!wx?'':wx.roof==='Dome'?'Indoors':`${wx.tempF??'–'}°F · wind ${wx.windMph??0} mph${wx.precip&&wx.precip!=='None'?' · '+wx.precip:''}`;
const CHD='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',CHU='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const evp=ev=>(ev>=0?'+':'−')+Math.abs(ev).toFixed(1)+'%';
const money=v=>(v<0?'−$':'+$')+Math.abs(v).toFixed(2);
const rowsOf=k=>LD.filter(r=>r[0]===k&&(CW==null||r[6]===CW));
const val=(k,t,c)=>{const r=rowsOf(k).find(r=>r[1]===t);return r?r[COL[c]]:NaN};
const rank=(k,t,c)=>{const v=val(k,t,c),hi=k.endsWith('_O');return 1+rowsOf(k).filter(r=>hi?r[COL[c]]>v:r[COL[c]]<v).length};
const key=g=>'pm2-'+g.id+'-'+g.lines.asOf;
const payout=o=>o>0?o:10000/-o;
const logOf=g=>LOG.find(l=>l.gameId===g.id),resOf=id=>RES.find(r=>r.gameId===id&&r.homeScore!=null&&r.awayScore!=null);
function grade(l){const r=resOf(l.gameId);if(!r)return null;const m=r.homeScore-r.awayScore,x=m+l.spread;
  const su=m===0?'P':((m>0)===(l.homeWin>=.5)?'W':'L'),ats=x===0?'P':((x>0)===(l.atsSide==='home')?'W':'L');
  let best=null,profit=null;if(l.bestEV>0){best=l.bestType==='ML'?(m===0?'P':((m>0)===(l.bestSide==='home')?'W':'L')):(x===0?'P':((x>0)===(l.bestSide==='home')?'W':'L'));profit=best==='W'?payout(l.bestOdds):best==='L'?-100:0}
  const clv=r.closingSpread==null?null:(l.atsSide==='home'?l.spread-r.closingSpread:r.closingSpread-l.spread);
  return {m,su,ats,best,profit,clv,r}}
const weeks=()=>[...new Set(GAMES.map(g=>g.week))].sort((a,b)=>a-b);
const rec=(arr)=>{const w=arr.filter(x=>x==='W').length,l=arr.filter(x=>x==='L').length,p=arr.filter(x=>x==='P').length;return {w,l,p,s:`${w}-${l}${p?'-'+p:''}`,pct:w+l?w/(w+l):null}};
const RC={W:'w',L:'l',P:'t'};
function stateFor(g){if(!ST[g.id]){const d={lines:{...g.lines},plays:g.players.map(p=>p.plays)};const s=load(key(g),null);ST[g.id]=s&&s.plays&&s.plays.length===g.players.length?s:d}return ST[g.id]}
function calc(g){
  CW=g.week;const pr0=rowsOf('PPG_O'),LG=pr0.reduce((a,r)=>a+r[2],0)/(pr0.length||1);
  const st=stateFor(g),L=st.lines,H=g.home.team,A=g.away.team,w=[SET.wSeason,SET.wVenue,SET.wL3];
  const bl=(f,k,t,v)=>w[0]*f(k,t,'season')+w[1]*f(k,t,v)+w[2]*f(k,t,'l3');
  const hp=bl(val,'PPG_O',H,'home')+bl(val,'PPG_D',A,'away')-LG,ap=bl(val,'PPG_O',A,'away')+bl(val,'PPG_D',H,'home')-LG;
  const F=[['Scoring','Base scoring matchup',hp-ap],['Scoring','Home field',SET.hfa]];
  for(const [k,n] of STATS){const wt=SET.statWeights[k];if(!wt)continue;
    const ha=bl(rank,k+'_D',A,'away')-bl(rank,k+'_O',H,'home'),aa=bl(rank,k+'_D',H,'home')-bl(rank,k+'_O',A,'away');F.push(['Matchup',n,(ha-aa)/31*wt])}
  const I=g.inputs||{};
  if(I.turnoverMargin)F.push(['Situation','Turnover margin',(I.turnoverMargin.home-I.turnoverMargin.away)*SET.toPts*SET.toReg]);
  if(I.sos)F.push(['Situation','Schedule strength',(I.sos.home-I.sos.away)*SET.sosW]);
  if(I.postBye)F.push(['Situation','Post-bye history',(I.postBye.home-I.postBye.away)*SET.byeW]);
  const wx=I.weather,sev=wxSev(wx);
  if(wx){const sh=t=>{const p=bl(val,'PassYPG_O',t,t===H?'home':'away'),r=bl(val,'RushYPG_O',t,t===H?'home':'away');return p/(p+r)};F.push(['Situation','Weather',sev*(sh(A)-sh(H))*SET.wxW])}
  g.adjustments.forEach(a=>F.push([a.group,a.label,a.pts]));
  g.players.forEach((p,i)=>{const v=st.plays[i]?p.ptsPlays:p.ptsOut;if(v)F.push(['Players',`${p.player} ${st.plays[i]?'plays':'out'}`,v])});
  const m=F.reduce((s,f)=>s+f[2],0),tot=hp+ap-sev*SET.wxTotal,sd=SET.sd,pw=Phi(m/sd),x=m+L.spread,whole=Number.isInteger(L.spread);
  const hc=whole?Phi((x-.5)/sd):Phi(x/sd),push=whole?Phi((x+.5)/sd)-hc:0,ac=1-hc-push,pc=hc;
  const vd=ev=>ev>=SET.betEV?'Bet':ev>0?'Lean':'Pass';
  const mk=(n,t,kind,pW,pP,o,oo)=>{const pr=profit(o),pL=1-pW-pP,ev=pW*pr-pL*100,b=pr/100,k=Math.max(0,(b*pW-pL)/b);return {n,t,kind,p:pW,push:pP,o,need:be(o),nv:be(o)/(be(o)+be(oo)),ev,roi:ev/100,kelly:k/4,fairO:fairOdds(pW/(pW+pL)),v:vd(ev)}};
  const bets=[mk(g.home.name+' ML','home','Moneyline',pw,0,L.mlHome,L.mlAway),mk(g.away.name+' ML','away','Moneyline',1-pw,0,L.mlAway,L.mlHome),mk(g.home.name+' '+sgn(L.spread),'home','Spread',hc,push,L.spreadOddsHome,L.spreadOddsAway),mk(g.away.name+' '+sgn(-L.spread),'away','Spread',ac,push,L.spreadOddsAway,L.spreadOddsHome)];
  const sb=bets[2].ev>=bets[3].ev?bets[2]:bets[3],mb=bets[0].ev>=bets[1].ev?bets[0]:bets[1],best=bets.reduce((a,b)=>b.ev>a.ev?b:a);
  return {F,m,sev,hs:(tot+m)/2,as:(tot-m)/2,pw,pc,push,bets,sb,mb,best,w,win:pw>=.5?g.home.name:g.away.name,wp:Math.max(pw,1-pw),fav:m>=0?g.home.name:g.away.name};
}

const TAB_IDX={board:0,best:1,record:2};let curTop=0;
function slide(name){const bar=$('tabBar');bar.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));const btn=bar.querySelector(`[data-tab="${name}"]`),sl=$('tabSlider');if(!btn)return;sl.style.left=(btn.offsetLeft)+'px';sl.style.width=btn.offsetWidth+'px'}
function anim(){const a=$('app');a.classList.remove('anim');void a.offsetWidth;a.classList.add('anim')}
function teamCol(g){const r=document.documentElement;r.style.setProperty('--home',g.home.night);r.style.setProperty('--away',g.away.night)}
function route(){
  const h=location.hash.slice(1);let g=GAMES.find(x=>x.id===h),tab='pick';
  if(!g)for(const [t] of TABS){g=GAMES.find(x=>h===x.id+'-'+t);if(g){tab=t;break}}
  if(g){slide('board');game(g,tab);return}
  if(h==='best'){slide('best');best();return}
  if(h==='record'){slide('record');record();return}
  const dm=h.match(/^day-(\d{4}-\d\d-\d\d|tbd)$/);if(dm)SELDAY=dm[1];
  const wm=h.match(/^week-(\d+)$/);if(wm){const g0=GAMES.filter(g=>g.week===+wm[1]).map(dayOf).sort()[0];if(g0)SELDAY=g0}
  slide('board');board();
}
const ESPN_ID={WAS:'wsh'};

function render(g,tab){
  const c=calc(g);CW=g.week;const L=stateFor(g).lines;
  if(tab==='pick'){const T=x=>x==='home'?g.home:g.away,pill=v=>`<span class="pill p-${v}">${v}</span>`;
  $('pbA').style.width=(1-c.pw)*100+'%';$('pbH').style.width=c.pw*100+'%';
  $('mlA').textContent=pct(1-c.pw,0);$('mlH').textContent=pct(c.pw,0);$('mlA').classList.toggle('fav',c.pw<.5);$('mlH').classList.toggle('fav',c.pw>=.5);
  $('mlAf').textContent='fair '+odds(fair(1-c.pw));$('mlHf').textContent='fair '+odds(fair(c.pw));
  $('mlF').innerHTML=`${esc(c.win)} to win · ${esc(c.mb.n)} ${odds(c.mb.o)} ${pill(c.mb.v)} <b class="${c.mb.ev>0?'w':'l'}">EV ${evp(c.mb.ev)}</b>`;
  $('spL').textContent=`· ${g.home.abbr} ${sgn(L.spread)}`;$('spB').innerHTML=badge(T(c.sb.t));$('spN').textContent=c.sb.n;
  $('spF').innerHTML=`Covers ${pct(c.sb.p)} ${pill(c.sb.v)} <b class="${c.sb.ev>0?'w':'l'}">EV ${evp(c.sb.ev)}</b>`;
  if(c.best.ev>0){$('bvB').innerHTML=badge(T(c.best.t));$('bvN').textContent=`${c.best.n} ${odds(c.best.o)}`;$('bvF').innerHTML=`${pill(c.best.v)} <b class="w">EV ${evp(c.best.ev)}</b> · wins ${pct(c.best.p)}`}
  else{$('bvB').innerHTML='';$('bvN').textContent='No edge';$('bvF').innerHTML=`Best is ${esc(c.best.n)} at <b class="l">EV ${evp(c.best.ev)}</b>`}
  const as=Math.round(c.as),hs=Math.round(c.hs),row=(t,v,w)=>`${badge(t)}<span>${esc(t.abbr)}</span><b class="${w?'':'lo'}">${v}</b>`;
  $('psA').innerHTML=row(g.away,as,as>hs);$('psH').innerHTML=row(g.home,hs,hs>=as);
  $('psF').textContent=`Model ${g.home.abbr} ${sgn(-c.m)} · market ${sgn(L.spread)} · total ${(c.hs+c.as).toFixed(1)}`;}
  if(tab==='pick'){
    const spT=c.sb.v==='Bet'?`Spread: <b>${esc(c.sb.n)}</b> has a real edge at this price. That's a bet.`:c.sb.v==='Lean'?`Spread: <b>${esc(c.sb.n)}</b> has a small edge, too thin to trust. Lean.`:`Spread: neither side has an edge once the juice is paid. <b>Pass.</b>`;
    const mlT=c.mb.ev>0?`Moneyline: <b>${esc(c.mb.n)} ${odds(c.mb.o)}</b> has ${c.mb.v==='Bet'?'a real':'a small'} edge (${c.mb.v.toLowerCase()}).`:`Moneyline: no value. Fair prices are ${esc(g.home.name)} ${odds(fair(c.pw))} and ${esc(g.away.name)} ${odds(fair(1-c.pw))}.`;
    const out=g.players.map((p,i)=>stateFor(g).plays[i]?null:p.player).filter(Boolean);
    $('plain').innerHTML=`<p>The model has the <b>${esc(c.win)}</b> winning <b>${pct(c.wp,0)}</b> of the time, by about ${Math.abs(c.m).toFixed(1)} points. The market says ${esc(g.home.abbr)} ${sgn(L.spread)}; the model makes it ${sgn(-c.m)}.</p><p>${spT}</p><p>${mlT}</p><p class="best">Best value: ${c.best.ev>0?esc(c.best.n)+' '+odds(c.best.o)+' · '+c.best.v:'no bet has an edge at these prices'}</p><p class="note">Assumes out: ${esc(out.join(', ')||'nobody')}.</p><div class="links"><a href="#${esc(g.id)}-lines">See the value on each bet →</a><a href="#${esc(g.id)}-drivers">Change who plays →</a></div>`}
  if($('cbox'))curve(g);
  if(tab==='lines')c.bets.forEach((b,i)=>{$('nm'+i).textContent=b.n;const v=$('vd'+i);v.className='pill p-'+b.v;v.textContent=b.v;$('mp'+i).textContent=pct(b.p);$('nd'+i).textContent=pct(b.need);const ed=$('ed'+i);ed.textContent=evp(b.ev);ed.className=b.ev>0?'w':'l';
    v.closest('.br').title=`Fair ${odds(b.fairO)} · book no-vig ${pct(b.nv)}${b.push>0.001?` · push ${pct(b.push)}`:''}${b.ev>0?` · ¼ Kelly ${pct(b.kelly)}`:''}`});
  if(tab==='drivers'){$('drvH').textContent=`${c.fav} by ${Math.abs(c.m).toFixed(1)} · what builds it`;
    const mx=Math.max(...c.F.map(f=>Math.abs(f[2])),1);let lg='';
    $('drv').innerHTML=c.F.map(([gr,n,v])=>{const wd=Math.abs(v)/mx*50,hd=gr!==lg?`<div class="grp">${esc(gr)}</div>`:'';lg=gr;return `${hd}<span>${esc(n)}</span><div class="dbar"><i style="left:${v>=0?50:50-wd}%;width:${wd}%;background:var(${v>=0?'--home':'--away'})"></i></div><span class="v">${sgn(v,2)}</span>`}).join('')}
  if(tab==='matchup'){
    const H=g.home.team,A=g.away.team,cs=['season','home','away','l3'];
    const tbl=(ot,ov,dt,dv,on,dn)=>`<thead><tr><th>Stat</th><th>${esc(on)}</th><th>Home</th><th>Road</th><th>L3</th><th>${esc(dn)}</th><th>Home</th><th>Road</th><th>L3</th><th>Edge</th></tr></thead><tbody>`+STATS.map(([k,n])=>{
      const cell=(key,t,x)=>{const r=rank(key,t,x),v=val(key,t,x);return `<td><span class="rk ${r<=10?'g1':r>=23?'g3':''}">${r}</span><small>${v.toFixed(1)}</small></td>`};
      const bo=c.w[0]*rank(k+'_O',ot,'season')+c.w[1]*rank(k+'_O',ot,ov)+c.w[2]*rank(k+'_O',ot,'l3'),bd=c.w[0]*rank(k+'_D',dt,'season')+c.w[1]*rank(k+'_D',dt,dv)+c.w[2]*rank(k+'_D',dt,'l3'),e=bd-bo;
      return `<tr><td class="nm">${n}</td>${cs.map(x=>cell(k+'_O',ot,x)).join('')}${cs.map(x=>cell(k+'_D',dt,x)).join('')}<td class="${Math.abs(e)<2?'t':e>0?'w':'l'}">${Math.abs(e)<2?'Even':esc(e>0?on:dn)}</td></tr>`}).join('')+'</tbody>';
    $('rk1').innerHTML=tbl(H,'home',A,'away',g.home.abbr+' O',g.away.abbr+' D');$('rk2').innerHTML=tbl(A,'away',H,'home',g.away.abbr+' O',g.home.abbr+' D')}
}
function curve(g){
  const box=$('cbox'),svg=$('curve');if(!box)return;const W=box.clientWidth,H=box.clientHeight;if(!W)return;
  const c=calc(g),L=stateFor(g).lines,m=c.m,sd=SET.sd,T=-L.spread;
  const lo=Math.min(-21,m-3*sd),hi=Math.max(28,m+3*sd),l=8,r=8,tp=40,b=30;
  const X=x=>l+(x-lo)/(hi-lo)*(W-l-r),pk=1/(sd*Math.sqrt(2*Math.PI)),Y=y=>H-b-y/pk*(H-b-tp),pdf=x=>Math.exp(-(((x-m)/sd)**2)/2)/(sd*Math.sqrt(2*Math.PI));
  const c1=Math.min(0,T),c2=Math.max(0,T);
  const area=(a,z)=>{if(z<=a)return'';let p=`M${X(a)},${Y(0)}`;for(let i=0;i<=60;i++){const x=a+(z-a)*i/60;p+=`L${X(x).toFixed(1)},${Y(pdf(x)).toFixed(1)}`}return p+`L${X(z)},${Y(0)}Z`};
  const pL=Phi((c1-m)/sd),pR=1-Phi((c2-m)/sd),pM=1-pL-pR,hn=g.home.name,an=g.away.name;
  let tk='';const step=W<520?14:7;for(let x=Math.ceil(lo/step)*step;x<=hi;x+=step)tk+=`<line x1="${X(x)}" x2="${X(x)}" y1="${H-b}" y2="${H-b+5}" stroke="var(--mute)"/><text x="${X(x)}" y="${H-b+21}" text-anchor="middle" style="fill:var(--mute)">${x===0?'Tie':(x>0?g.home.abbr:g.away.abbr)+' '+Math.abs(x)}</text>`;
  const xm=X(m),anc=xm>W-140?'end':xm<140?'start':'middle';
  svg.innerHTML=`<path d="${area(lo,c1)}" fill="var(--away)"/><path d="${area(c1,c2)}" fill="var(--gold)"/><path d="${area(c2,hi)}" fill="var(--home)"/><line x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}" stroke="var(--mute)"/>${tk}<line x1="${X(T)}" x2="${X(T)}" y1="${tp-6}" y2="${H-b}" stroke="var(--ink)" stroke-dasharray="4 4"/><text x="${xm}" y="${tp-14}" text-anchor="${anc}" style="font-weight:700">Model: ${esc(c.fav)} by ${Math.abs(m).toFixed(1)} · line ${sgn(L.spread)}</text>`;
  $('leg').innerHTML=`<div><span><i style="background:var(--away)"></i>${esc(an)} win and cover</span><b>${pct(pL)}</b></div><div><span><i style="background:var(--gold)"></i>${esc(T>0?hn+' win, '+an+' cover':an+' win, '+hn+' cover')}</span><b>${pct(pM)}</b></div><div><span><i style="background:var(--home)"></i>${esc(hn)} win and cover</span><b>${pct(pR)}</b></div>`;
}

const setTbh=()=>document.documentElement.style.setProperty('--tbh',$('tabBar').offsetHeight+'px');setTbh();
const recenter=()=>{setTbh();const a=document.querySelector('.tab-btn.active');if(a)slide(a.dataset.tab);['dayStrip','gbar'].forEach(id=>{const b=$(id);if(b)centerIn(b,b.querySelector('.on'))});const g=$('gbar');if(g)document.documentElement.style.setProperty('--gbh',g.offsetHeight+'px')};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(recenter);addEventListener('load',recenter);
addEventListener('resize',()=>recenter());
// ---- Data: read NFL_Pick_Model.xlsx in this folder (the weekly workbook); fall back to data/*.json
function txt(x){if(typeof x==='number'&&x>30000){const d=new Date(Math.round((x-25569)*864e5));return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}return String(x??'')}
function isoOf(x){if(x==null||x==='')return null;if(typeof x==='number'){const d=new Date(Math.round((x-25569)*864e5));return d.toISOString().slice(0,10)}const s=String(x).trim();let m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);if(m)return m[0];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const y=m[3].length===2?2000+ +m[3]:+m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}return null}
function num(x,d=null){if(x===null||x===undefined||x==='')return d;const n=Number(x);return isNaN(n)?d:n}
function fromWorkbook(wb){
  const T=n=>{const ws=wb.Sheets[n];if(!ws)throw new Error('Missing sheet: '+n);return XLSX.utils.sheet_to_json(ws,{defval:null,raw:true})};
  const st={};let curD=null;T('Settings').forEach(r=>{if(!r['Setting'])return;if(r['Setting']==='Current day (site opens here)')curD=isoOf(r['Value']);else st[r['Setting']]=num(r['Value'])});
  const settings={wSeason:st['Weight: full season'],wVenue:st['Weight: venue split'],wL3:st['Weight: last 3 games'],hfa:st['Home-field points'],sd:st['Std. dev. of NFL margin'],toPts:st['Points per turnover'],toReg:st['Turnover regression'],sosW:st['Schedule-strength weight'],byeW:st['Post-bye weight'],betEV:st['Bet threshold (EV per $100)'],currentDay:curD,
    statWeights:{RushYPG:st['Weight: rushing yds/game'],RushYPC:st['Weight: yards per rush'],PassYPG:st['Weight: passing yds/game'],PassYPA:st['Weight: yards per pass att'],RZTD:st['Weight: red zone TD %']},wxW:st['Weather: pass-share weight']??6,wxTotal:st['Weather: total points lost per severity']??4};
  const rows=T('League Data').filter(r=>r['Stat key']).map(r=>[r['Stat key'],r['Team'],num(r['Season']),num(r['Home']),num(r['Away']),num(r['Last 3']),num(r['Week'])]);
  const h1=wb.Sheets['League Data']['I1'];const note=h1?String(h1.v):'';
  const by=(n,id)=>T(n).filter(r=>r['Game ID']===id);
  let week=null;const games=[];
  T('Games').filter(r=>r['Game ID']).forEach(g=>{
    const id=g['Game ID'];const gw=num(g['Week']);week=Math.max(week??0,gw??0);
    const side=s=>({team:g[s+' team (as in League Data)'],name:g[s+' name'],abbr:g[s+' abbr'],color:g[s+' colour'],night:g[s+' night colour'],record:String(g[s+' record']??'')});
    const inputs={};
    if(g['Home TO margin/g']!==null)inputs.turnoverMargin={home:num(g['Home TO margin/g']),away:num(g['Away TO margin/g'])};
    if(g['Home SOS rating']!==null)inputs.sos={home:num(g['Home SOS rating']),away:num(g['Away SOS rating'])};
    if(g['Home post-bye win %']!==null&&g['Away post-bye win %']!==null)inputs.postBye={home:num(g['Home post-bye win %']),away:num(g['Away post-bye win %'])};
    if(g['Roof'])inputs.weather={roof:g['Roof'],tempF:num(g['Temp °F']),windMph:num(g['Wind mph'],0),precip:g['Precip']||'None',note:g['Weather source / as of']||''};
    const tables=[];
    by('Context',id).forEach(r=>{let t=tables.find(x=>x.title===r['Table']);if(!t){t={title:r['Table'],cols:[],rows:[],note:''};tables.push(t)}
      const cells=[1,2,3,4,5,6].map(i=>r['Col '+i]).filter(v=>v!==null&&v!=='').map(String),k=String(r['Row type']||'Row').trim().toLowerCase();
      if(k==='header')t.cols=cells;else if(k==='note')t.note=cells[0]||'';else{const row=cells.map(c=>({t:c}));if(r['Col 1 detail'])row[0].d=r['Col 1 detail'];t.rows.push(row)}});
    games.push({id,week:gw,date:isoOf(g['Game date']),kickoff:g['Kickoff'],venue:g['Venue'],tv:g['TV'],note:g['Note']||'',home:side('Home'),away:side('Away'),
      lines:{spread:num(g['Home spread']),spreadOddsHome:num(g['Home spread odds']),spreadOddsAway:num(g['Away spread odds']),mlHome:num(g['Home moneyline']),mlAway:num(g['Away moneyline']),total:num(g['Total']),source:g['Lines source']||'',asOf:txt(g['Lines as of'])},
      inputs,adjustments:by('Adjustments',id).map(a=>({group:a['Group'],label:a['Label'],pts:num(a['Points (+ helps home)'],0)})),
      players:by('Players',id).map(p=>({player:p['Player'],team:p['Team'],pos:p['Pos'],note:p['Note']||'',plays:String(p['Plays?']).trim().toLowerCase()==='yes',ptsPlays:num(p['Points if plays'],0),ptsOut:num(p['Points if out'],0)})),
      context:tables,writeup:by('Write-up',id).sort((a,b)=>(a['Order']||0)-(b['Order']||0)).map(w=>[w['Heading'],w['Text']]),writeupAsOf:txt(g['Write-up as of']||''),
      sources:by('Sources',id).map(x=>[x['Name'],x['URL']])})});
  const opt=n=>wb.Sheets[n]?T(n):[];
  const pickLog=opt('Pick Log').filter(r=>r['Game ID']).map(r=>({gameId:r['Game ID'],week:num(r['Week']),loggedAt:txt(r['Logged at']),spread:num(r['Home spread']),oddsSH:num(r['Home spread odds']),oddsSA:num(r['Away spread odds']),mlH:num(r['Home ML']),mlA:num(r['Away ML']),margin:num(r['Model margin (home)']),homeWin:num(r['Home win %']),homeCover:num(r['Home cover %']),push:num(r['Push %']),evMLH:num(r['EV home ML']),evMLA:num(r['EV away ML']),evSH:num(r['EV home spread']),evSA:num(r['EV away spread']),atsSide:r['ATS side'],atsVerdict:r['Spread verdict'],bestLabel:r['Best bet'],bestType:r['Best type'],bestSide:r['Best side'],bestOdds:num(r['Best odds']),bestEV:num(r['Best EV per $100']),bestVerdict:r['Best verdict']}));
  const results=opt('Results').filter(r=>r['Game ID']).map(r=>({gameId:r['Game ID'],week:num(r['Week']),awayScore:num(r['Away score']),homeScore:num(r['Home score']),closingSpread:num(r['Closing home spread']),closingMLHome:num(r['Closing home ML'])}));
  return [{note,rows},{season:2026,week,settings,games,pickLog,results}];
}
const loadXlsx=()=>fetch('NFL_Pick_Model.xlsx?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('no workbook');return r.arrayBuffer()}).then(b=>fromWorkbook(XLSX.read(new Uint8Array(b),{type:'array'})));
const loadJson=()=>Promise.all([fetch('data/league.json').then(r=>r.json()),fetch('data/games.json').then(r=>r.json())]);
let SRC='workbook';
(typeof XLSX!=='undefined'?loadXlsx():Promise.reject()).catch(()=>{SRC='data files';return loadJson()}).then(([lg,gm])=>{
  LD=lg.rows;META={season:gm.season,week:gm.week,note:lg.note};SET=gm.settings;GAMES=gm.games;ST={};LOG=gm.pickLog||[];RES=gm.results||[];
  $('subTitle').textContent=`${GAMES[0]?LEAGUE(GAMES[0]):'NFL'} · ${META.season} season · times ET`;
  $('status').textContent=`${LOG.length} picks logged · ${RES.filter(r=>r.homeScore!=null&&r.awayScore!=null).length} results · from ${SRC}`;
  addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
}).catch(()=>{$('app').innerHTML='<div class="empty">The model data didn\'t load. Check that NFL_Pick_Model.xlsx is in the same folder as this page, then reload.</div>'});
}
